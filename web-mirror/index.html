<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ScoreCast — Remote Scorer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main>
  <h1>ScoreCast <span class="subtitle">Remote Scorer</span></h1>

  <section id="join-screen">
    <p class="hint">
      Enter the pairing code shown on the main device's "Pair a Scoring Device" screen.
    </p>
    <form id="join-form">
      <label for="pairing-code">Pairing code</label>
      <input id="pairing-code" name="pairing-code" type="text" inputmode="text"
             autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="sessionId:joinToken" required />
      <p id="join-error" class="error" role="alert" hidden></p>
      <button id="join-btn" type="submit">Join</button>
    </form>
  </section>

  <section id="score-screen" hidden>
    <div class="status-row">
      <span id="connection-dot" class="dot" data-state="connecting" aria-live="polite">● Connecting…</span>
      <span id="sport-name" class="sport-name"></span>
      <button id="leave-btn" type="button" class="link-btn">Leave session</button>
    </div>
    <p id="score-error" class="error" role="alert" hidden></p>

    <div id="period-row" class="period-row" hidden>
      <span id="period-label" class="clock-label">Period</span>
      <button id="period-minus" class="step-btn" type="button">-</button>
      <span id="period-value" class="period-value">1 / 4</span>
      <button id="period-plus" class="step-btn" type="button">+</button>
    </div>

    <div id="clock-row" class="clock-row" hidden>
      <span class="clock-label">Clock</span>
      <span id="clock-time" class="clock-time">0:00</span>
      <button id="clock-toggle" class="step-btn" type="button">Start</button>
      <button id="clock-minus" class="step-btn" type="button">-30</button>
      <button id="clock-plus" class="step-btn" type="button">+30</button>
    </div>

    <div id="shot-clock-row" class="clock-row" hidden>
      <span class="clock-label">Shot Clock</span>
      <span id="shot-clock-time" class="clock-time">0:00</span>
      <button id="shot-clock-toggle" class="step-btn" type="button">Start</button>
      <button id="shot-clock-minus" class="step-btn" type="button">-5</button>
      <button id="shot-clock-plus" class="step-btn" type="button">+5</button>
      <button id="shot-clock-reset" class="step-btn" type="button">Rst</button>
    </div>

    <div class="teams">
      <div class="team-card">
        <label class="team-name-label" for="home-name">Home</label>
        <input id="home-name" class="team-name-input" type="text" maxlength="24"
               autocomplete="off" autocapitalize="characters" spellcheck="false" />
        <div class="score" id="home-score" aria-live="polite">0</div>
        <div class="btn-row">
          <button id="home-minus" class="pill-btn" type="button">-1</button>
          <span id="home-increments" class="btn-row"></span>
        </div>
        <div class="color-picker">
          <button id="home-color-toggle" class="color-toggle" type="button"
                  aria-expanded="false" aria-controls="home-colors">
            <span id="home-color-current" class="color-toggle-dot"></span>
            <span class="color-toggle-caret" aria-hidden="true">&#9656;</span>
          </button>
          <div class="color-row" id="home-colors" hidden></div>
        </div>
      </div>
      <div class="team-card">
        <label class="team-name-label" for="away-name">Away</label>
        <input id="away-name" class="team-name-input" type="text" maxlength="24"
               autocomplete="off" autocapitalize="characters" spellcheck="false" />
        <div class="score" id="away-score" aria-live="polite">0</div>
        <div class="btn-row">
          <button id="away-minus" class="pill-btn" type="button">-1</button>
          <span id="away-increments" class="btn-row"></span>
        </div>
        <div class="color-picker">
          <button id="away-color-toggle" class="color-toggle" type="button"
                  aria-expanded="false" aria-controls="away-colors">
            <span id="away-color-current" class="color-toggle-dot"></span>
            <span class="color-toggle-caret" aria-hidden="true">&#9656;</span>
          </button>
          <div class="color-row" id="away-colors" hidden></div>
        </div>
      </div>
    </div>

    <div id="sets-row" class="sets-row" hidden>
      <div class="sets-readout">
        <span>Sets — Home: <strong id="home-sets">0</strong></span>
        <span>Away: <strong id="away-sets">0</strong></span>
      </div>
    </div>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
